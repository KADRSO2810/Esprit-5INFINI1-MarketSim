server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: market-simulator-backend
  main:
    allow-circular-references: true

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:market_simulator}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configuration de sécurité, JWT et Market Data
app:
  jwt:
    secret: ${JWT_SECRET:4c69b2d887e5f1a92e10c73294c6b840e34b9d09a25ef14c995f3b728d1c92ea}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 heures en millisecondes
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  finnhub:
    api-key: ${FINNHUB_API_KEY:db6bck9r01qmd5lj8b6gdb6bck9r01qmd5lj8b70}
    webhook-secret: ${FINNHUB_WEBHOOK_SECRET:db6bck9r01qmd5lj8b80}
    ws-url: ${FINNHUB_WS_URL:wss://ws.finnhub.io}
  market:
    default-watchlist: ${MARKET_WATCHLIST:BINANCE:BTCUSDT,BINANCE:ETHUSDT,BINANCE:SOLUSDT,BINANCE:XRPUSDT,BINANCE:BNBUSDT,BINANCE:AVAXUSDT,BINANCE:DOGEUSDT,BINANCE:ADAUSDT,BINANCE:DOTUSDT,BINANCE:MATICUSDT,BINANCE:LINKUSDT,BINANCE:LTCUSDT,AAPL,MSFT,TSLA,NVDA,AMZN,GOOGL,META,NFLX,AMD,INTC,JPM,BABA,DIS}
    batch-interval-ms: ${MARKET_BATCH_INTERVAL_MS:2000}
  trading:
    initial-cash: ${INITIAL_CASH:100000}
    max-quote-age-sec: ${MAX_QUOTE_AGE_SEC:30}
    risk-window-ticks: ${RISK_WINDOW_TICKS:300}
    drawdown-window: ${DRAWDOWN_WINDOW:120}
  backtest:
    fee-bps: ${BACKTEST_FEE_BPS:5}
    max-window-days: ${BACKTEST_MAX_WINDOW_DAYS:60}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8090}
  stress:
    max-local-xai-banks: ${MAX_LOCAL_XAI_BANKS:10}



# Configuration SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha
